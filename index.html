<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mower Hours"><link rel="manifest" href="manifest.webmanifest"><title>Mower Hours</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,Arial;color:#111827}.app{max-width:600px;margin:auto;padding:28px 16px}.hero{background:#111827;color:#fff;border-radius:25px;padding:25px}.hero small{opacity:.7;letter-spacing:2px}.hero h1{margin:7px 0 24px}.total{font-size:40px;font-weight:800}.card{background:#fff;margin-top:15px;padding:19px;border-radius:20px;box-shadow:0 4px 16px #0001}label{font-weight:700;font-size:13px}input,textarea{width:100%;padding:13px;margin:7px 0 14px;border:1px solid #d1d5db;border-radius:12px;font-size:16px}.timer{text-align:center;font-size:44px;font-weight:800;margin:10px}button{width:100%;border:0;border-radius:15px;padding:17px;font-size:17px;font-weight:800}.start{background:#16a34a;color:#fff}.stop{background:#dc2626;color:#fff}.secondary{background:#e5e7eb;margin-top:9px}.status{text-align:center;color:#6b7280;margin:12px}.entry{border-top:1px solid #eee;padding:13px 0}.entry b{display:flex;justify-content:space-between}.entry span{font-size:13px;color:#6b7280}.del{width:auto;padding:5px 8px;font-size:12px;background:#fee2e2;color:#991b1b}.note{font-size:12px;color:#6b7280;margin-top:12px}
</style></head><body><main class="app"><section class="hero"><small>RIDE-ON LAWN MOWER</small><h1>Hours Register</h1><div>Total recorded usage</div><div class="total" id="total">0h 00m</div></section>
<section class="card"><label>Operator</label><input id="op" placeholder="Enter name"><label>Notes (optional)</label><textarea id="notes" placeholder="Area mowed, maintenance note, etc."></textarea><div class="timer" id="timer">00:00:00</div><button id="main" class="start">START MOWER</button><div class="status" id="status">Ready to start</div></section>
<section class="card"><h2>Usage History</h2><div id="history"></div><button id="export" class="secondary">Export Register (CSV)</button><button id="manual" class="secondary">Add Manual Entry</button></section><div class="note">Records are stored on this device. Export a backup periodically.</div></main>
<script>
const K='mowerEntries',R='mowerRunning',O='mowerOperator',g=x=>document.getElementById(x);let E=JSON.parse(localStorage.getItem(K)||'[]'),run=JSON.parse(localStorage.getItem(R)||'null');g('op').value=localStorage.getItem(O)||'';g('op').oninput=()=>localStorage.setItem(O,g('op').value);const p=n=>String(n).padStart(2,'0'),human=m=>{let x=Math.round(m/60000);return Math.floor(x/60)+'h '+p(x%60)+'m'},clock=m=>{let s=Math.floor(m/1000);return p(Math.floor(s/3600))+':'+p(Math.floor(s%3600/60))+':'+p(s%60)},save=()=>localStorage.setItem(K,JSON.stringify(E));
function draw(){g('total').textContent=human(E.reduce((a,e)=>a+e.end-e.start,0));g('main').textContent=run?'STOP MOWER':'START MOWER';g('main').className=run?'stop':'start';g('status').textContent=run?'Mower running — started '+new Date(run.start).toLocaleTimeString():'Ready to start';let h=g('history');h.innerHTML=E.length?'':'No usage recorded yet.';[...E].sort((a,b)=>b.start-a.start).forEach(e=>{let d=document.createElement('div');d.className='entry';d.innerHTML='<b>'+new Date(e.start).toLocaleDateString()+' • '+human(e.end-e.start)+'<button class="del">Delete</button></b><span>'+(e.operator||'No operator')+' • '+new Date(e.start).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+' – '+new Date(e.end).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+(e.notes?'<br>'+e.notes:'')+'</span>';d.querySelector('button').onclick=()=>{if(confirm('Delete this entry?')){E=E.filter(x=>x.id!==e.id);save();draw()}};h.appendChild(d)})}
g('main').onclick=()=>{if(!run){run={start:Date.now(),operator:g('op').value.trim(),notes:g('notes').value.trim()};localStorage.setItem(R,JSON.stringify(run));g('notes').value=''}else{E.push({...run,end:Date.now(),id:String(Date.now())});save();run=null;localStorage.removeItem(R)}draw()};
g('export').onclick=()=>{let a=[['Date','Operator','Start','Finish','Minutes','Notes'],...E.map(e=>[new Date(e.start).toLocaleDateString(),e.operator,new Date(e.start).toLocaleTimeString(),new Date(e.end).toLocaleTimeString(),Math.round((e.end-e.start)/60000),e.notes||''])];let csv=a.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),b=document.createElement('a');b.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));b.download='mower-hours-register.csv';b.click()};
g('manual').onclick=()=>{let d=prompt('Date YYYY-MM-DD',new Date().toISOString().slice(0,10));if(!d)return;let s=prompt('Start HH:MM','08:00'),f=prompt('Finish HH:MM','09:00');if(!s||!f)return;let st=new Date(d+'T'+s).getTime(),en=new Date(d+'T'+f).getTime();if(en<=st)return alert('Finish must be after start');E.push({id:String(Date.now()),start:st,end:en,operator:g('op').value.trim(),notes:'Manual entry'});save();draw()};
setInterval(()=>g('timer').textContent=run?clock(Date.now()-run.start):'00:00:00',1000);draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
